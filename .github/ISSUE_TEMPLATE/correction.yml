name: Report a correction
description: A place closed, moved, or has wrong details on the site.
title: "[fix] "
labels: ["correction"]
body:
  - type: input
    id: name
    attributes:
      label: Which place?
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong and what should it say?
    validations:
      required: true
